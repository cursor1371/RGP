name: Build Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  # 支持 Git Tag 触发（如 v1.0.0）
  tags:
    - 'v*'
  # 支持手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository = "用户名/仓库名"，自动转小写作为镜像名
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 授权 GITHUB_TOKEN 推送镜像到 GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 配置 Docker Buildx（支持缓存） ───────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. 登录 GHCR ────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. 生成镜像标签与元数据 ─────────────────────
      #
      #   push main   → ghcr.io/user/repo:latest
      #                  ghcr.io/user/repo:sha-a1b2c3d
      #
      #   push v1.2.0 → ghcr.io/user/repo:v1.2.0
      #                  ghcr.io/user/repo:latest
      #                  ghcr.io/user/repo:sha-a1b2c3d
      #
      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Git Tag → v1.2.0
            type=semver,pattern={{version}}
            # 所有构建 → sha-a1b2c3d（精确溯源）
            type=sha,prefix=sha-,format=short

      # ── 5. 构建并推送镜像 ───────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # GitHub Actions 缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. 输出构建摘要 ─────────────────────────────
      - name: Print image info
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy on Railway:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
